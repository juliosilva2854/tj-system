# docker-compose para dev local - mongo + backend + frontend
# Para iniciar: docker-compose up --build
# Para parar: docker-compose down
# Para limpar volumes: docker-compose down -v

version: "3.9"

services:
  # MongoDB Database
  mongo:
    image: mongo:7
    container_name: gestao-tj-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gestao-tj-network

  # FastAPI Backend
  backend:
    build: ./backend
    container_name: gestao-tj-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      # Database
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: gestaotj
      
      # Security
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-prod}
      SEED_SECRET: ${SEED_SECRET:-}
      
      # Email
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      
      # App
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      
      # Optional
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8001:8001"
    volumes:
      - ./backend/uploads:/app/uploads  # Para salvar uploads de fotos
    networks:
      - gestao-tj-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # React Frontend
  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL:-http://localhost:8001}
    container_name: gestao-tj-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - gestao-tj-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  mongo-data:
    driver: local

networks:
  gestao-tj-network:
    driver: bridge
