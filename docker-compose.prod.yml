# Producao: nginx reverse-proxy na frente + SSL.
# Use junto com /app/docker-compose.yml: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
version: "3.9"

services:
  backend:
    expose:
      - "8001"
    ports: []  # nao expor diretamente
    environment:
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      SEED_SECRET: ${SEED_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}

  frontend:
    expose:
      - "80"
    ports: []

  proxy:
    image: nginx:1.27-alpine
    container_name: gestao-tj-proxy
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/logs:/var/log/nginx
    ports:
      - "80:80"
      - "443:443"
